<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logos/rezflo-logo.png" />
    <link rel="apple-touch-icon" href="/logos/rezflo-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="RezFlo is a 24/7 multilingual AI phone receptionist for restaurants. Take phone orders, book reservations, answer FAQs — and inject orders straight into Clover." />
    <meta property="og:title" content="RezFlo — Every call answered. Every order captured." />
    <meta property="og:description" content="A 24/7 multilingual AI phone receptionist built for restaurants. Live in days, not months." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      ElevenLabs preconnects — establish TCP+TLS handshakes to the
      voice-agent CDN, API and WebSocket endpoints during page load
      so when the user taps "Talk to Anthony" the connection is
      already warm. Without these, the first ~600ms of the call
      goes into TCP/TLS/DNS for these hosts and audio comes through
      muffled or laggy at the start of the conversation.
    -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link rel="preconnect" href="https://api.elevenlabs.io" crossorigin />
    <link rel="preconnect" href="https://api.us.elevenlabs.io" crossorigin />
    <link rel="dns-prefetch" href="https://api.elevenlabs.io" />
    <link rel="dns-prefetch" href="https://api.us.elevenlabs.io" />
    <!--
      Font stack:
        Inter             — body + hero per RezFlo hero spec
        Plus Jakarta Sans — display headings (replaces Fraunces serif which was clipping)
        Open Sans         — card descriptions per ExpandingCards spec
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>RezFlo — Every call answered. Every order captured.</title>
    <!-- ElevenLabs ConvAI widget (loaded once, used by Anthony voice agent card + floating button) -->
    <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
