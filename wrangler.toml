# Cloudflare Workers Build config. The Vite build emits a static SPA
# into ./dist; the worker just serves that directory as assets — no
# server code, no Worker script.
#
# `not_found_handling = "single-page-application"` makes the worker
# fall back to /index.html for any unknown path so deep links
# (#stories, #try, etc.) resolve to the SPA shell instead of 404ing.
#
# The `name` must match the worker name in the Cloudflare dashboard.
name = "rezflo-website"
compatibility_date = "2026-05-11"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
